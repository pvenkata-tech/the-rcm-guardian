# Default stack uses live OpenAI (Vision + embeddings). Create `.env` beside this file — see `.env.example`.
# Compose substitutes variables from `.env` automatically.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rcm
      POSTGRES_PASSWORD: rcm
      POSTGRES_DB: rcm_guardian
    ports:
      - "5432:5432"
    volumes:
      - rcm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rcm -d rcm_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  lims-mock:
    build:
      context: ./docker/lims-mock
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rcm:rcm@postgres:5432/rcm_guardian
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL:-claude-3-5-sonnet-20241022}
      OTEL_SERVICE_NAME: rcm-guardian
      LIMS_BASE_URL: http://lims-mock:8080
      UPLOADS_DIR: /uploads
      PERSIST_UPLOADS: "true"
    volumes:
      - ./uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      lims-mock:
        condition: service_healthy

volumes:
  rcm_pgdata:
