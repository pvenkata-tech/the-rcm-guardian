<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
  <title id="title">RCM Guardian samples folder</title>
  <desc id="desc">Flow from helper scripts to generated artifacts to Docker API mount</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="820" height="280" rx="16" fill="url(#bg)"/>
  <text x="410" y="48" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">samples/</text>
  <text x="410" y="76" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13" text-anchor="middle">Local tooling and synthetic non-PHI test documents</text>
  <!-- Card 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="108" width="220" height="132" rx="12" fill="url(#card)" stroke="#475569" stroke-width="1"/>
  </g>
  <text x="150" y="138" fill="#38bdf8" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">HELPERS</text>
  <text x="150" y="162" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10" text-anchor="middle">start-local.*</text>
  <text x="150" y="178" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10" text-anchor="middle">ensure_local_data.py</text>
  <text x="150" y="194" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10" text-anchor="middle">generate_synthetic_</text>
  <text x="150" y="208" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10" text-anchor="middle">samples.py</text>
  <text x="150" y="230" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle">Repo root / Docker</text>
  <!-- Arrow -->
  <path d="M 280 174 L 330 174" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="335,174 322,168 322,180" fill="#64748b"/>
  <!-- Card 2 -->
  <g filter="url(#shadow)">
    <rect x="350" y="108" width="220" height="132" rx="12" fill="url(#card)" stroke="#475569" stroke-width="1"/>
  </g>
  <text x="460" y="138" fill="#4ade80" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">generated/</text>
  <text x="460" y="168" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11" text-anchor="middle">synthetic_eob_01–05</text>
  <text x="460" y="188" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11" text-anchor="middle">.pdf + .png (10 files)</text>
  <text x="460" y="212" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle">Gitignored binaries</text>
  <text x="460" y="228" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle">SHA-256 unique</text>
  <!-- Arrow -->
  <path d="M 590 174 L 640 174" stroke="#64748b" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="645,174 632,168 632,180" fill="#64748b"/>
  <!-- Card 3 -->
  <g filter="url(#shadow)">
    <rect x="660" y="108" width="120" height="132" rx="12" fill="url(#card)" stroke="#475569" stroke-width="1"/>
  </g>
  <text x="720" y="138" fill="#f472b6" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">API</text>
  <text x="720" y="168" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11" text-anchor="middle">/uploads</text>
  <text x="720" y="192" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle">Docker</text>
  <text x="720" y="208" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" text-anchor="middle">Compose</text>
  <text x="720" y="224" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="9" text-anchor="middle">bind-mount</text>
</svg>
