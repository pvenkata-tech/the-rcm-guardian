<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" role="img" aria-labelledby="t d">
  <title id="t">Ordinal PDF vs PNG scenarios</title>
  <desc id="d">Five rows showing distinct PDF and PNG document types per ordinal</desc>
  <rect width="780" height="320" rx="14" fill="#fafafa"/>
  <rect x="2" y="2" width="776" height="316" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="390" y="36" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Ordinal scenarios · PDF vs PNG (independent documents)</text>
  <!-- header row -->
  <text x="90" y="72" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">ORD</text>
  <text x="260" y="72" fill="#b91c1c" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">PDF</text>
  <text x="520" y="72" fill="#1d4ed8" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">PNG</text>
  <!-- rows -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect x="24" y="88" width="732" height="40" rx="8" fill="#fff" stroke="#f1f5f9"/>
    <text x="90" y="112" fill="#0f172a" font-weight="600" text-anchor="middle">01</text>
    <text x="260" y="112" fill="#334155">EOB / office + lab</text>
    <text x="520" y="112" fill="#334155">Pharmacy remittance</text>
    <rect x="24" y="136" width="732" height="40" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="90" y="160" fill="#0f172a" font-weight="600" text-anchor="middle">02</text>
    <text x="260" y="160" fill="#334155">Urgent care claim summary</text>
    <text x="520" y="160" fill="#334155">PT plan of care</text>
    <rect x="24" y="184" width="732" height="40" rx="8" fill="#fff" stroke="#f1f5f9"/>
    <text x="90" y="208" fill="#0f172a" font-weight="600" text-anchor="middle">03</text>
    <text x="260" y="208" fill="#334155">ASC / surgery</text>
    <text x="520" y="208" fill="#334155">Molecular lab requisition</text>
    <rect x="24" y="232" width="732" height="40" rx="8" fill="#f8fafc" stroke="#f1f5f9"/>
    <text x="90" y="256" fill="#0f172a" font-weight="600" text-anchor="middle">04</text>
    <text x="260" y="256" fill="#334155">DME / CPAP</text>
    <text x="520" y="256" fill="#334155">Home health authorization</text>
    <rect x="24" y="280" width="732" height="32" rx="8" fill="#fff" stroke="#f1f5f9"/>
    <text x="90" y="300" fill="#0f172a" font-weight="600" text-anchor="middle">05</text>
    <text x="260" y="300" fill="#334155">Radiology (landscape)</text>
    <text x="520" y="300" fill="#334155">Mammography screening (portrait)</text>
  </g>
</svg>
